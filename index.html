<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Organize seu dia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>✅ TaskFlow</h1>
    <p class="subtitle">Organize suas tarefas com simplicidade</p>
  </header>

  <main>
    <p>Projeto base para praticar branches no Git.</p>
    <input type="text" id="task-input" placeholder="Digite uma tarefa...">
    <button id="add-btn">Adicionar</button>
    <div class="filters">
      <button class="filter-btn" data-filter="all">Todas</button>
      <button class="filter-btn" data-filter="pending">Pendentes</button>
      <button class="filter-btn" data-filter="completed">Concluídas</button>
    </div>
    <ul id="task-list"></ul>
  </main>

  <footer>
    <p>&copy; 2026 TaskFlow. Todos os direitos reservados.</p>
    <p>Feito com 💙 para praticar Git Branches</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
